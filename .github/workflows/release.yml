name: Release version

on:
  push:
    branches:
      - main
      - "push-action/**"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Test
        run: make test

      - name: Verify Build
        run: make build

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Verify UI Build
        run: make build-ui

      - name: Run foonver
        id: foonver
        uses: foonly/foonver@v0.14.0
        with:
          command: "auto"
          changelog: "true"
          push: "true"
          # web/package.json isn't discovered by foonver itself (it only scans
          # the repo root, not subdirectories) but web/src/App.vue imports and
          # displays its version directly, so keep it in sync — foonver finds
          # the current version.json value in web/package.json and rewrites it
          # to the new version, in the same commit/tag as version.json's bump.
          version_sync: "web/package.json"

      - name: Build Release Binary
        # Re-build now that the new tag exists, so the version is embedded correctly
        if: steps.foonver.outputs.is_bumped == 'true'
        run: make build

      - name: Build Release UI
        # Re-build now that web/package.json has the new version (synced by
        # foonver above), so the deployed footer (App.vue) shows it correctly.
        if: steps.foonver.outputs.is_bumped == 'true'
        run: make build-ui

      - name: Sign Binaries
        if: steps.foonver.outputs.is_bumped == 'true'
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: go run cmd/sign-binaries/main.go bin/jman bin/jman-api bin/jman-monitor bin/jman-agent

      - name: Install SSH Key
        if: steps.foonver.outputs.is_bumped == 'true'
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_ed25519
          known_hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      - name: Deploy API binary
        if: steps.foonver.outputs.is_bumped == 'true'
        run: >-
          rsync -lci bin/jman-api
          ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.BACKEND_DEPLOY_PATH }}bin/jman-api

      - name: Restart jman-api service
        if: steps.foonver.outputs.is_bumped == 'true'
        run: ssh ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} 'sudo systemctl restart ${{ vars.BACKEND_SERVICE_NAME }}'

      - name: Deploy UI files
        if: steps.foonver.outputs.is_bumped == 'true'
        run: >-
          rsync -rlci --delete web/dist/
          ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.FRONTEND_DEPLOY_PATH }}

      - name: Create GitHub Release
        if: steps.foonver.outputs.is_bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.foonver.outputs.version }}
          name: Release ${{ steps.foonver.outputs.version }}
          body: ${{ steps.foonver.outputs.release_notes }}
          draft: false
          prerelease: false
          files: |
            bin/*
            completions/*

      - name: Update AUR PKGBUILD
        if: steps.foonver.outputs.is_bumped == 'true'
        continue-on-error: true
        run: ./scripts/update-aur.sh ${{ steps.foonver.outputs.version }}

      - name: Publish to AUR
        if: steps.foonver.outputs.is_bumped == 'true'
        continue-on-error: true
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: jman
          pkgbuild: aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.foonver.outputs.version }}"

      - name: Slack notification (success)
        if: success() && steps.foonver.outputs.is_bumped == 'true'
        uses: slackapi/slack-github-action@v2
        env:
          MSG: |-
            ✅ jman release ${{ steps.foonver.outputs.version }} by ${{ github.actor }} succeeded.

            ${{ steps.foonver.outputs.release_notes }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0ANZD53XAS",
              "text": ${{ toJSON(env.MSG) }}
            }

      - name: Slack notification (failure)
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0ANZD53XAS",
              "text": ${{ toJSON(format('❌ jman build/release {0} failed.', github.sha)) }}
            }
