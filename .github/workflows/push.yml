name: Release version

on:
  push:
    branches:
      - release
      - "push-action/**"

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conventional Changelog Action
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.MASTER_PAT }}
          version-file: "./package.json"
