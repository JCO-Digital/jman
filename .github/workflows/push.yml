name: Release version

on:
  push:
    branches:
      - main
      - "push-action/**"

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.MASTER_PAT }}
          version-file: "./version.json"

      - name: Setup Go
        if: steps.changelog.outputs.skipped == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Build
        if: steps.changelog.outputs.skipped == 'false'
        run: make build

      - name: Create Release
        if: steps.changelog.outputs.skipped == 'false'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "bin/jman"
          tag: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}

      - name: Collect release commits
        if: steps.changelog.outputs.skipped == 'false'
        id: release_commits
        shell: sh
        run: |
          git fetch --tags --force

          CURRENT_TAG="${{ steps.changelog.outputs.tag }}"
          PREV_TAG="$(git tag --sort=-v:refname | grep -Fxv "$CURRENT_TAG" | head -n 1)"
          MAX_COMMITS=25

          if [ -z "$PREV_TAG" ]; then
            RANGE="$CURRENT_TAG"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          fi

          TOTAL_COMMITS="$(git rev-list --count "$RANGE" 2>/dev/null || echo 0)"

          # If we have a range (i.e. not the first release), skip the most recent commit (the tag commit)
          if [ -n "$PREV_TAG" ]; then
            COMMITS="$(git log "$RANGE" \
              --pretty=format:'- %s (%h) — %an, %ad' \
              --date=format:'%Y-%m-%d' \
              -n "$((MAX_COMMITS + 1))" 2>/dev/null | tail -n +2 || true)"
          else
            COMMITS="$(git log "$RANGE" \
              --pretty=format:'- %s (%h) — %an, %ad' \
              --date=format:'%Y-%m-%d' \
              -n "$MAX_COMMITS" 2>/dev/null || true)"
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- No commit messages found for this release range."
          elif [ "$TOTAL_COMMITS" -gt "$MAX_COMMITS" ]; then
            REMAINING=$((TOTAL_COMMITS - MAX_COMMITS))
            COMMITS="$(printf "%s\n...and %d more commits." "$COMMITS" "$REMAINING")"
          fi

          {
            echo "previous_tag=${PREV_TAG}"
            echo "total_commits=${TOTAL_COMMITS}"
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Slack notification (success)
        if: success() && steps.changelog.outputs.skipped == 'false'
        uses: slackapi/slack-github-action@v2
        env:
          MSG: |-
            ✅ jman release ${{ steps.changelog.outputs.tag }} by ${{ github.actor }} succeeded.

            Commit messages:
            ${{ steps.release_commits.outputs.commits }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0LPYCB8F",
              "text": ${{ toJSON(env.MSG) }}
            }

      - name: Slack notification (failure)
        if: failure() && steps.changelog.outputs.skipped == 'false'
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0LPYCB8F",
              "text": ${{ toJSON(format('❌ jman release {0} by {1} failed.', steps.changelog.outputs.tag, github.actor)) }}
            }
