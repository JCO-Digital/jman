name: Release version

on:
  push:
    branches:
      - main
      - "push-action/**"

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.MASTER_PAT }}
          version-file: "./version.json"

      - name: Setup Go
        if: steps.changelog.outputs.skipped == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Build
        if: steps.changelog.outputs.skipped == 'false'
        run: make build

      - name: Sign Binaries
        if: steps.changelog.outputs.skipped == 'false'
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: go run cmd/sign-binaries/main.go bin/jman bin/jman-api bin/jman-monitor

      - name: Create Release
        if: steps.changelog.outputs.skipped == 'false'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "bin/*"
          tag: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}

      - name: Slack notification (success)
        if: success() && steps.changelog.outputs.skipped == 'false'
        uses: slackapi/slack-github-action@v2
        env:
          MSG: |-
            ✅ jman release ${{ steps.changelog.outputs.tag }} by ${{ github.actor }} succeeded.

            Changelog:
            ${{ steps.changelog.outputs.clean_changelog }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0ANZD53XAS",
              "text": ${{ toJSON(env.MSG) }}
            }

      - name: Slack notification (failure)
        if: failure() && steps.changelog.outputs.skipped == 'false'
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0ANZD53XAS",
              "text": ${{ toJSON(format('❌ jman release {0} by {1} failed.', steps.changelog.outputs.tag, github.actor)) }}
            }
