name: Release version

on:
  push:
    branches:
      - main
      - "push-action/**"

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Test
        run: make test

      - name: Verify Build
        run: make build

      - name: Run foonver
        id: foonver
        uses: foonly/foonver@v0.9.1
        with:
          command: "auto"
          changelog: "true"
          push: "true"

      - name: Build Release Binary
        # Re-build now that the new tag exists, so the version is embedded correctly
        if: steps.foonver.outputs.is_bumped == 'true'
        run: make build

      - name: Sign Binaries
        if: steps.foonver.outputs.is_bumped == 'true'
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: go run cmd/sign-binaries/main.go bin/jman bin/jman-api bin/jman-monitor

      - name: Create GitHub Release
        if: steps.foonver.outputs.is_bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.foonver.outputs.version }}
          name: Release ${{ steps.foonver.outputs.version }}
          body: ${{ steps.foonver.outputs.release_notes }}
          draft: false
          prerelease: false
          files: |
            bin/jman*
            bin/completions/*

      - name: Slack notification (success)
        if: success() && steps.foonver.outputs.is_bumped == 'true'
        uses: slackapi/slack-github-action@v2
        env:
          MSG: |-
            ✅ jman release ${{ steps.foonver.outputs.version }} by ${{ github.actor }} succeeded.

            ${{ steps.foonver.outputs.release_notes }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0ANZD53XAS",
              "text": ${{ toJSON(env.MSG) }}
            }

      - name: Slack notification (failure)
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0ANZD53XAS",
              "text": ${{ toJSON(format('❌ jman build/release {0} failed.', github.sha)) }}
            }
