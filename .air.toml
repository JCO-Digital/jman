root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/jman-api ./cmd/jman-api"
  bin = "./tmp/jman-api"
  include_ext = ["go"]
  # Only the Go source trees; web/ (node_modules) and the rest would make air
  # walk thousands of directories and restart jman-api on unrelated changes.
  include_dir = ["cmd", "internal"]
  exclude_dir = ["bin", "tmp", "completions", "web"]
  delay = 1000

[log]
  time = false

[misc]
  clean_on_exit = true
