# SSH for make local-dev-agent: jman-api logs in as a site user with the key
# in .local-dev/ssh (mounted at /run/local-dev/ssh.pub), as it would on
# SpinupWP. No passwords and no root. The host key lives on the /sites volume,
# so it survives container rebuilds.
HostKey /sites/.local-dev-ssh/ssh_host_ed25519_key
AuthorizedKeysFile /sites/.local-dev-ssh/authorized_keys/%u
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowTcpForwarding no
X11Forwarding no
