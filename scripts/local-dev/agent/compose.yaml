# make local-dev-agent: containers that act as managed servers. dev-agent-1/2
# run jman-agent against the jman-api of make local-dev on the host;
# dev-ssh-1 has no agent, so jman-api reaches its site over SSH only. Run through
# scripts/local-dev/local-dev.sh, which sets API_PORT, AGENT_ENV_DIR,
# AGENT_BIN_DIR, SSH_PUBKEY and SSH_PORT_1/2/3, and creates the per-server token
# files and the SSH key.
name: jman-local-dev

x-server: &server
  build:
    context: .
    additional_contexts:
      agentbin: ${AGENT_BIN_DIR:?run through scripts/local-dev/local-dev.sh}
  image: jman-local-dev-server
  init: true
  depends_on:
    mariadb:
      condition: service_healthy
  # jman-api listens on all interfaces of the host.
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: localdev
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  dev-agent-1:
    <<: *server
    hostname: dev-agent-1
    env_file:
      # JMAN_AGENT_TOKEN, created by local-dev.sh agent-up.
      - path: ${AGENT_ENV_DIR}/dev-agent-1.env
        required: false
    environment:
      SITES: alpha.local-dev.test beta.local-dev.test
      DB_ROOT_PASSWORD: localdev
      JMAN_AGENT_API_URL: http://host.docker.internal:${API_PORT:-8080}/api
    # SSH for jman-api, on the host's loopback only. The web server isn't
    # published: the sites run plugin versions with known vulnerabilities.
    ports:
      - 127.0.0.1:${SSH_PORT_1:-2221}:22
    volumes:
      - sites-1:/sites
      - state-1:/var/lib/jman-agent
      - wpcli-cache:/var/cache/wp-cli
      - ${SSH_PUBKEY:?run through scripts/local-dev/local-dev.sh}:/run/local-dev/ssh.pub:ro

  dev-agent-2:
    <<: *server
    hostname: dev-agent-2
    env_file:
      # JMAN_AGENT_TOKEN, created by local-dev.sh agent-up.
      - path: ${AGENT_ENV_DIR}/dev-agent-2.env
        required: false
    environment:
      SITES: gamma.local-dev.test
      DB_ROOT_PASSWORD: localdev
      JMAN_AGENT_API_URL: http://host.docker.internal:${API_PORT:-8080}/api
    # SSH for jman-api, on the host's loopback only. The web server isn't
    # published: the sites run plugin versions with known vulnerabilities.
    ports:
      - 127.0.0.1:${SSH_PORT_2:-2222}:22
    volumes:
      - sites-2:/sites
      - state-2:/var/lib/jman-agent
      - wpcli-cache:/var/cache/wp-cli
      - ${SSH_PUBKEY:?run through scripts/local-dev/local-dev.sh}:/run/local-dev/ssh.pub:ro

  dev-ssh-1:
    <<: *server
    hostname: dev-ssh-1
    environment:
      SITES: delta.local-dev.test
      DB_ROOT_PASSWORD: localdev
      NO_AGENT: "1"
    ports:
      - 127.0.0.1:${SSH_PORT_3:-2223}:22
    volumes:
      - sites-3:/sites
      - wpcli-cache:/var/cache/wp-cli
      - ${SSH_PUBKEY:?run through scripts/local-dev/local-dev.sh}:/run/local-dev/ssh.pub:ro

volumes:
  db:
  sites-1:
  sites-2:
  sites-3:
  state-1:
  state-2:
  wpcli-cache:
